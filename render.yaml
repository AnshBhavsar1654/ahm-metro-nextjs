services:
  - type: web
    name: ahmedabad-metro
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install -g bun && bun install --frozen-lockfile && bun run build
    startCommand: bun run start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: NEXT_PUBLIC_WEATHER_API_KEY
        sync: false
